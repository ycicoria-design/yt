name: Build DM Cleanup APK
on:
  push:
    branches: [dm-cleanup-apk-build]
    paths:
      - "dm-src.*"
      - ".github/workflows/build-dm-apk.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack app source
        run: cat dm-src.0? | base64 -d | tar xz
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
      - name: Compile signed debug APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: DM-Cleanup-Helper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct .apk on isolated branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DM_Cleanup_Helper.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DM_Cleanup_Helper.apk
          git commit -m "Publish built APK"
          git push origin HEAD:dm-cleanup-apk-build
