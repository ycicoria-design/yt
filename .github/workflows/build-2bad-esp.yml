name: Build 2BAD ESP APK

on:
  push:
    branches:
      - 2bad-esp-build
    paths:
      - "2bad-esp/**"
      - ".github/workflows/build-2bad-esp.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        working-directory: 2bad-esp
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp 2bad-esp/app/build/outputs/apk/debug/app-debug.apk 2BAD-ESP.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 2BAD-ESP-APK
          path: 2BAD-ESP.apk
          if-no-files-found: error
