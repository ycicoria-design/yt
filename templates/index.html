
<!doctype html>
<html>
<head>
<title>Viral AI Creator Assistant</title>
<style>
body{background:#090909;color:white;font-family:Arial;padding:30px}
.card{background:#171717;border-radius:15px;padding:20px;margin:15px 0}
input,button{padding:15px;border-radius:10px;border:0}
button{background:#ff6b35;color:white}
pre{white-space:pre-wrap}
</style>
</head>
<body>
<h1>🔥 PRO CREATOR ASSISTANT</h1>
<form method="post">
<input name="topic" placeholder="Enter video topic" style="width:60%">
<button>Analyze</button>
</form>

{% if error %}
<div class="card">{{error}}</div>
{% endif %}

{% if report %}
<div class="card">
<h2>📌 Topic</h2>
{{report.topic if report.topic else ""}}
</div>

{% for key,value in report.items() %}
<div class="card">
<h2>{{key}}</h2>
<pre>{{value}}</pre>
</div>
{% endfor %}
{% endif %}
</body>
</html>
